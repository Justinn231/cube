<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Homeserver Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --bubble-user: #0f3460;
      --bubble-ai: #242444;
      --tool-bg: #111122;
      --accent: #e94560;
      --accent-dim: #a03040;
      --text: #e0e0e0;
      --text-dim: #888;
      --border: #333355;
      --radius: 18px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SF Mono", "Fira Code", Consolas, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      overflow: hidden;
    }

    /* ---- Auth overlay ---- */
    #auth-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px;
      z-index: 200;
    }
    #auth-overlay.hidden { display: none; }
    #auth-overlay h1 { font-size: 1.3rem; color: var(--accent); }
    #auth-overlay p  { color: var(--text-dim); font-size: 0.85rem; text-align: center; }
    #auth-token {
      width: 100%; max-width: 320px;
      padding: 12px 16px; border-radius: 12px;
      border: 1px solid var(--border);
      background: #0d1b2a; color: var(--text);
      font-size: 16px; outline: none;
    }
    #auth-token:focus { border-color: var(--accent); }
    #auth-btn {
      width: 100%; max-width: 320px;
      padding: 12px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    #auth-error { color: var(--accent); font-size: 0.82rem; display: none; }

    /* ---- Main layout ---- */
    #app {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em; }
    #logout-btn {
      background: none; border: none; color: var(--text-dim);
      font-size: 0.8rem; cursor: pointer; padding: 4px 8px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 4px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    /* ---- Bubbles ---- */
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .bubble.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* inline markdown inside ai bubbles */
    .bubble.ai .text { white-space: pre-wrap; }
    .bubble.ai code {
      background: #111; border-radius: 4px;
      padding: 1px 5px;
      font-family: var(--mono); font-size: 0.84em;
    }
    .bubble.ai pre {
      background: #111; border-radius: 8px;
      padding: 10px; margin: 8px 0;
      overflow-x: auto;
      font-family: var(--mono); font-size: 0.82em;
    }
    .bubble.ai pre code { background: none; padding: 0; }

    /* ---- Tool call blocks ---- */
    .tool-block {
      margin-top: 8px;
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.82em;
      overflow: hidden;
    }
    .tool-block summary {
      padding: 6px 10px;
      cursor: pointer;
      color: #7ba4e8;
      font-family: var(--mono);
      user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .tool-block summary::marker { content: ""; }
    .tool-spinner {
      width: 10px; height: 10px;
      border: 2px solid #7ba4e8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tool-block[data-done] .tool-spinner { display: none; }
    .tool-block[data-done] summary::before { content: "✓ "; color: #4caf50; }
    .tool-block pre {
      padding: 8px 10px; margin: 0;
      overflow-x: auto; max-height: 200px; overflow-y: auto;
      color: #ccc; font-family: var(--mono);
    }

    /* ---- Typing indicator ---- */
    .typing {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) var(--radius) 4px;
      padding: 10px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* ---- Input area ---- */
    #input-area {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px; border-radius: 22px;
      border: 1px solid var(--border);
      background: #0d1b2a; color: var(--text);
      font-size: 16px; /* prevents iOS zoom */
      font-family: var(--font);
      resize: none; overflow-y: auto; max-height: 120px;
      line-height: 1.4; outline: none;
    }
    #user-input:focus { border-color: var(--accent); }
    #send-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      border: none; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #send-btn:disabled { background: var(--accent-dim); cursor: default; }
  </style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay">
  <h1>Homeserver Assistant</h1>
  <p>Bitte gib dein Auth-Token ein.</p>
  <input id="auth-token" type="password" placeholder="Bearer-Token" autocomplete="current-password" />
  <button id="auth-btn">Anmelden</button>
  <span id="auth-error">Ungültiges Token – bitte erneut versuchen.</span>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>Homeserver Assistant</h1>
    <button id="logout-btn">Abmelden</button>
  </header>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Nachricht eingeben…"></textarea>
    <button id="send-btn" aria-label="Senden">&#9658;</button>
  </div>
</div>

<script>
  const TOKEN_KEY = 'hs_token';
  let authToken = localStorage.getItem(TOKEN_KEY) || '';
  let history = [];   // [{role, content}] sent with each request
  let busy = false;

  const overlay  = document.getElementById('auth-overlay');
  const appEl    = document.getElementById('app');
  const tokenEl  = document.getElementById('auth-token');
  const authBtn  = document.getElementById('auth-btn');
  const authErr  = document.getElementById('auth-error');
  const msgsEl   = document.getElementById('messages');
  const inputEl  = document.getElementById('user-input');
  const sendBtn  = document.getElementById('send-btn');

  function showApp()   { overlay.classList.add('hidden');    appEl.style.display = 'flex'; inputEl.focus(); }
  function showLogin() { overlay.classList.remove('hidden'); appEl.style.display = 'none'; }

  if (authToken) showApp(); else showLogin();

  authBtn.addEventListener('click', tryLogin);
  tokenEl.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  async function tryLogin() {
    const t = tokenEl.value.trim();
    if (!t) return;
    const ok = await checkToken(t);
    if (ok) {
      authToken = t;
      localStorage.setItem(TOKEN_KEY, t);
      authErr.style.display = 'none';
      showApp();
    } else {
      authErr.style.display = 'block';
    }
  }

  async function checkToken(t) {
    try {
      const r = await fetch('/health', { headers: { Authorization: `Bearer ${t}` } });
      return r.ok;
    } catch { return false; }
  }

  document.getElementById('logout-btn').addEventListener('click', () => {
    authToken = '';
    localStorage.removeItem(TOKEN_KEY);
    history = [];
    msgsEl.innerHTML = '';
    showLogin();
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  // ---- DOM helpers ----

  function addBubble(role, text = '') {
    const wrap = document.createElement('div');
    wrap.className = `bubble ${role}`;
    if (role === 'ai') {
      const span = document.createElement('span');
      span.className = 'text';
      wrap.appendChild(span);
    } else {
      wrap.textContent = text;
    }
    msgsEl.appendChild(wrap);
    scroll();
    return wrap;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing'; div.id = 'typing';
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    msgsEl.appendChild(div);
    scroll();
  }
  function removeTyping() { document.getElementById('typing')?.remove(); }

  function addToolBlock(bubble, name, id) {
    const details = document.createElement('details');
    details.className = 'tool-block';
    details.setAttribute('data-id', id);
    details.open = true;
    details.innerHTML = `<summary><span class="tool-spinner"></span>${name}</summary><pre>(läuft…)</pre>`;
    bubble.appendChild(details);
    scroll();
    return details;
  }

  function finishToolBlock(bubble, name, output) {
    // find the last open tool block for this tool name
    const blocks = [...bubble.querySelectorAll('.tool-block:not([data-done])')];
    const last = blocks.reverse().find(b => b.querySelector('summary')?.textContent.includes(name));
    if (last) {
      last.setAttribute('data-done', '1');
      last.open = false;
      last.querySelector('pre').textContent = output;
    }
  }

  function renderMarkdown(text) {
    text = text
      .replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${esc(c.trimEnd())}</code></pre>`)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    return text;
  }
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scroll() { msgsEl.scrollTop = msgsEl.scrollHeight; }

  // ---- Send ----

  async function send() {
    if (busy) return;
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    busy = true;

    addBubble('user', msg);
    addTyping();

    const historyToSend = history.slice(-40); // last 20 turns

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`,
        },
        body: JSON.stringify({ message: msg, history: historyToSend }),
      });

      removeTyping();

      if (res.status === 401) {
        authToken = ''; localStorage.removeItem(TOKEN_KEY);
        addBubble('ai').querySelector('.text').textContent = 'Sitzung abgelaufen. Bitte neu anmelden.';
        setTimeout(showLogin, 1500);
        return;
      }
      if (!res.ok) {
        addBubble('ai').querySelector('.text').textContent = `Server-Fehler: ${res.status}`;
        return;
      }

      const aiBubble = addBubble('ai');
      const textSpan = aiBubble.querySelector('.text');
      let fullText = '';

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch { continue; }

          if (ev.type === 'text_delta') {
            fullText += ev.text;
            textSpan.innerHTML = renderMarkdown(fullText);
            scroll();
          } else if (ev.type === 'tool_start') {
            addToolBlock(aiBubble, ev.name, ev.id);
          } else if (ev.type === 'tool_result') {
            finishToolBlock(aiBubble, ev.name, ev.output);
          } else if (ev.type === 'error') {
            textSpan.textContent = `Fehler: ${ev.message}`;
          } else if (ev.type === 'done') {
            break;
          }
        }
      }

      history.push({ role: 'user', content: msg });
      history.push({ role: 'assistant', content: fullText });

    } catch (err) {
      removeTyping();
      addBubble('ai').querySelector('.text').textContent = `Verbindungsfehler: ${err.message}`;
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
